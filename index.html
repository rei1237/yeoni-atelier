<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="app-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="연이의 아틀리에">
  <meta name="theme-color" content="#f3e6d6">
  <title>연이의 아틀리에 · 달빛 카페</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="novel.css"><link rel="stylesheet" href="game-ui.css"><link rel="stylesheet" href="cafe-brand.css">
  <link rel="stylesheet" href="cafe-ux.css">
  <link rel="stylesheet" href="floral-theme.css">
  <link rel="stylesheet" href="cafe-play.css">
  <link rel="stylesheet" href="moonlight-ui.css">
  <link rel="stylesheet" href="world-island.css">
  <link rel="stylesheet" href="cafe-finish.css">
  <link rel="stylesheet" href="hunt-hud.css">
<link rel="stylesheet" href="yeoni-growth.css">
<link rel="stylesheet" href="decor-screen.css">
<link rel="stylesheet" href="settlement.css">
<link rel="stylesheet" href="cooking-stage.css">
<link rel="stylesheet" href="shop-ui.css">
<link rel="stylesheet" href="cafe-stage.css">
<link rel="stylesheet" href="title-pixel.css">
<link rel="stylesheet" href="main-pixel.css">
</head>
<body>
  <div id="boot-screen" class="boot-screen" role="status" aria-live="polite"><div class="boot-yeoni" role="img" aria-label="연이와 꽃돼지가 카페에서 함께 기다리고 있어요"><span class="boot-yeoni-body"></span><span class="boot-pig"><span class="boot-pig-body"></span></span><i></i><i></i><i></i></div><div class="boot-content"><p class="boot-place">연이의 아틀리에</p><h1>손님 맞을 준비를 하고 있어요</h1><p class="boot-message">잠시만 기다려 주세요.<br>곧 카페의 하루가 시작돼요.</p><div class="boot-progress-row"><span>카페 준비 중</span><span id="boot-count" aria-hidden="true"></span></div><progress id="boot-progress" max="100" value="0" aria-label="게임 준비 진행"></progress><p id="boot-copy" aria-live="off">찻잔과 친구들을 준비하고 있어요.</p></div></div>
  <div id="app">
    <header id="topbar" class="topbar" aria-live="off"></header>
    <main id="stage" class="stage">
      <canvas id="view" aria-label="카페 화면"></canvas>
      <div id="hits" class="hits"></div>
      <div id="bubbles" class="bubbles" aria-live="polite"></div>
      <div id="talk" class="talk-layer" aria-live="polite"></div>
      <div id="floaters" class="floaters" aria-hidden="true"></div>
    </main>
    <footer id="panel" class="panel"></footer>
  </div>
  <main id="world-screen" hidden></main>
  <div id="sheet-wrap" class="sheet-wrap" hidden>
    <div class="sheet-dim" data-action="sheet.close"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="novel" class="novel" hidden></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
