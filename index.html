<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#f3e6d6">
  <title>연이의 아틀리에 · 달빛 카페</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="novel.css"><link rel="stylesheet" href="game-ui.css"><link rel="stylesheet" href="cafe-brand.css">
</head>
<body>
  <div id="boot-screen" class="boot-screen" role="status" aria-live="polite"><img src="assets/illustrated/ui/loading.webp" width="280" height="336" alt="차를 준비하는 꽃돼지 연이"><h1>따뜻한 하루를 준비해요</h1><progress id="boot-progress" max="100" value="0" aria-label="게임 준비 진행"></progress><p id="boot-copy">카페 문을 여는 중이에요.</p></div>
  <div id="app">
    <header id="topbar" class="topbar" aria-live="off"></header>
    <main id="stage" class="stage">
      <canvas id="view" aria-label="카페 화면"></canvas>
      <div class="camera-controls" id="camera-controls" aria-label="카페 보기"><button data-action="camera.zoom" data-step="-0.2" aria-label="카페 축소">−</button><button data-action="camera.fit" aria-label="카페 전체 보기">전체</button><button data-action="camera.zoom" data-step="0.2" aria-label="카페 확대">＋</button></div>
      <div id="hits" class="hits"></div>
      <div id="bubbles" class="bubbles" aria-live="polite"></div>
      <div id="floaters" class="floaters" aria-hidden="true"></div>
    </main>
    <footer id="panel" class="panel"></footer>
  </div>
  <div id="sheet-wrap" class="sheet-wrap" hidden>
    <div class="sheet-dim" data-action="sheet.close"></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="novel" class="novel" hidden></div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
